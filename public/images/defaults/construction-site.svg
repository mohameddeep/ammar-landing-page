<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Construction site with tower crane">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15263f"/>
      <stop offset="0.6" stop-color="#2f5577"/>
      <stop offset="1" stop-color="#e9b47a"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b3a8"/>
      <stop offset="1" stop-color="#7c766b"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a45"/>
      <stop offset="1" stop-color="#4a3824"/>
    </linearGradient>
    <pattern id="lattice" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0 L20 20 M20 0 L0 20" stroke="#f59e0b" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="930" cy="560" r="120" fill="#ffd8a8" fill-opacity="0.25"/>

  <!-- distant city -->
  <g fill="#2a4462" fill-opacity="0.8">
    <rect x="20" y="470" width="60" height="200"/>
    <rect x="90" y="430" width="44" height="240"/>
    <rect x="980" y="450" width="70" height="220"/>
    <rect x="1060" y="410" width="50" height="260"/>
    <rect x="1120" y="480" width="70" height="190"/>
  </g>

  <!-- building frame under construction -->
  <g>
    <rect x="360" y="300" width="420" height="370" fill="none"/>
    <g fill="url(#concrete)">
      <rect x="350" y="650" width="440" height="20"/>
      <rect x="350" y="560" width="440" height="16"/>
      <rect x="350" y="470" width="440" height="16"/>
      <rect x="350" y="380" width="440" height="16"/>
      <rect x="350" y="290" width="300" height="16"/>
    </g>
    <g fill="#9a948a">
      <rect x="360" y="290" width="16" height="380"/>
      <rect x="460" y="290" width="16" height="380"/>
      <rect x="560" y="290" width="16" height="380"/>
      <rect x="660" y="380" width="16" height="290"/>
      <rect x="760" y="380" width="16" height="290"/>
    </g>
    <!-- glazing on lower floors -->
    <g fill="#7fb2d6" fill-opacity="0.45">
      <rect x="376" y="576" width="84" height="74"/>
      <rect x="476" y="576" width="84" height="74"/>
      <rect x="576" y="576" width="84" height="74"/>
      <rect x="676" y="576" width="84" height="74"/>
      <rect x="376" y="486" width="84" height="74"/>
      <rect x="476" y="486" width="84" height="74"/>
    </g>
    <!-- rebar -->
    <g stroke="#5b5348" stroke-width="3">
      <line x1="368" y1="290" x2="368" y2="250"/>
      <line x1="468" y1="290" x2="468" y2="250"/>
      <line x1="568" y1="290" x2="568" y2="250"/>
      <line x1="668" y1="380" x2="668" y2="340"/>
      <line x1="768" y1="380" x2="768" y2="340"/>
    </g>
    <!-- scaffolding -->
    <g stroke="#cbd5e1" stroke-opacity="0.7" stroke-width="3" fill="none">
      <line x1="800" y1="380" x2="800" y2="670"/>
      <line x1="830" y1="380" x2="830" y2="670"/>
      <line x1="800" y1="430" x2="830" y2="430"/>
      <line x1="800" y1="500" x2="830" y2="500"/>
      <line x1="800" y1="570" x2="830" y2="570"/>
      <line x1="800" y1="640" x2="830" y2="640"/>
      <line x1="800" y1="430" x2="830" y2="500"/>
      <line x1="800" y1="570" x2="830" y2="640"/>
    </g>
  </g>

  <!-- tower crane -->
  <g>
    <rect x="200" y="140" width="28" height="530" fill="url(#lattice)" stroke="#f59e0b" stroke-width="3"/>
    <rect x="120" y="128" width="720" height="22" fill="url(#lattice)" stroke="#f59e0b" stroke-width="3"/>
    <rect x="60" y="128" width="60" height="40" fill="#334155"/>
    <polygon points="200,128 214,70 228,128" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <line x1="214" y1="70" x2="120" y2="128" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="214" y1="70" x2="700" y2="128" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="232" y="150" width="34" height="30" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="236" y="154" width="26" height="14" fill="#7fb2d6" fill-opacity="0.7"/>
    <rect x="600" y="150" width="24" height="10" fill="#475569"/>
    <line x1="612" y1="160" x2="612" y2="300" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M604 300 h16 v6 a8 8 0 0 1 -16 0 z" fill="#f59e0b"/>
    <rect x="570" y="312" width="84" height="18" fill="#9a948a"/>
  </g>

  <!-- ground and site details -->
  <rect y="670" width="1200" height="130" fill="url(#soil)"/>
  <rect y="670" width="1200" height="6" fill="#f59e0b" fill-opacity="0.5"/>
  <g>
    <rect x="880" y="610" width="120" height="60" rx="6" fill="#f59e0b"/>
    <rect x="900" y="620" width="40" height="26" fill="#1e293b"/>
    <circle cx="905" cy="676" r="16" fill="#1f2937"/>
    <circle cx="975" cy="676" r="16" fill="#1f2937"/>
    <path d="M1000 630 l70 -40 l10 14 l-60 40 z" fill="#f59e0b"/>
    <path d="M1060 590 l30 10 l-8 30 l-30 -6 z" fill="#d97706"/>
  </g>
  <g fill="#f97316">
    <polygon points="90,700 100,670 110,700"/>
    <polygon points="140,700 150,670 160,700"/>
    <polygon points="190,700 200,670 210,700"/>
  </g>
</svg>
