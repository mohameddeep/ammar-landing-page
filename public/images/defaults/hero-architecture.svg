<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Modern architectural skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="0.55" stop-color="#1e3a5f"/>
      <stop offset="0.82" stop-color="#3f6f8f"/>
      <stop offset="1" stop-color="#f0a35e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.78" r="0.35">
      <stop offset="0" stop-color="#ffd8a8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#f59e57" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8db8"/>
      <stop offset="0.5" stop-color="#2c5476"/>
      <stop offset="1" stop-color="#14263d"/>
    </linearGradient>
    <linearGradient id="glassB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb2d6"/>
      <stop offset="0.6" stop-color="#2f5a7c"/>
      <stop offset="1" stop-color="#172b44"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9c7a8"/>
      <stop offset="1" stop-color="#8f7b5d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0b111c"/>
    </linearGradient>
    <pattern id="win" width="28" height="34" patternUnits="userSpaceOnUse">
      <rect width="28" height="34" fill="none"/>
      <rect x="3" y="4" width="22" height="26" fill="#bfe3ff" fill-opacity="0.18"/>
      <rect x="3" y="4" width="22" height="2" fill="#ffffff" fill-opacity="0.25"/>
    </pattern>
    <pattern id="winWarm" width="24" height="30" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="18" height="22" fill="#ffd59a" fill-opacity="0.22"/>
    </pattern>
    <pattern id="fins" width="18" height="10" patternUnits="userSpaceOnUse">
      <rect width="3" height="10" fill="#0b1426" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>

  <!-- distant skyline -->
  <g fill="#27405e" fill-opacity="0.75">
    <rect x="40" y="610" width="70" height="250"/>
    <rect x="120" y="560" width="54" height="300"/>
    <rect x="186" y="640" width="90" height="220"/>
    <polygon points="300,860 300,540 330,500 360,540 360,860"/>
    <rect x="380" y="600" width="60" height="260"/>
    <rect x="1180" y="590" width="70" height="270"/>
    <rect x="1260" y="540" width="46" height="320"/>
    <rect x="1320" y="620" width="88" height="240"/>
    <polygon points="1420,860 1420,520 1452,470 1484,520 1484,860"/>
    <rect x="1500" y="600" width="80" height="260"/>
  </g>

  <!-- main tower (centre) -->
  <g>
    <polygon points="700,880 700,250 790,170 880,250 880,880" fill="url(#glassA)"/>
    <polygon points="700,880 700,250 790,170 790,880" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="708" y="270" width="164" height="600" fill="url(#win)"/>
    <line x1="790" y1="170" x2="790" y2="110" stroke="#9fc3dd" stroke-width="4"/>
    <circle cx="790" cy="106" r="5" fill="#f97316"/>
  </g>

  <!-- left twisted tower -->
  <g>
    <path d="M470 880 L470 360 Q540 330 610 360 L610 880 Z" fill="url(#glassB)"/>
    <rect x="478" y="380" width="124" height="490" fill="url(#win)"/>
    <rect x="470" y="360" width="140" height="520" fill="url(#fins)"/>
  </g>

  <!-- right stepped tower -->
  <g>
    <rect x="950" y="330" width="180" height="550" fill="url(#glassA)"/>
    <rect x="980" y="270" width="120" height="60" fill="#36597a"/>
    <rect x="1010" y="230" width="60" height="40" fill="#2c4a68"/>
    <rect x="958" y="345" width="164" height="525" fill="url(#win)"/>
    <rect x="950" y="330" width="6" height="550" fill="#9fc3dd" fill-opacity="0.5"/>
  </g>

  <!-- low-rise heritage-inspired building (front) -->
  <g>
    <rect x="560" y="740" width="520" height="140" fill="url(#stone)"/>
    <rect x="560" y="728" width="520" height="14" fill="#efe1c6"/>
    <g fill="#5a4630" fill-opacity="0.85">
      <path d="M600 880 V800 a22 22 0 0 1 44 0 V880 Z"/>
      <path d="M680 880 V800 a22 22 0 0 1 44 0 V880 Z"/>
      <path d="M760 880 V800 a22 22 0 0 1 44 0 V880 Z"/>
      <path d="M840 880 V800 a22 22 0 0 1 44 0 V880 Z"/>
      <path d="M920 880 V800 a22 22 0 0 1 44 0 V880 Z"/>
      <path d="M1000 880 V800 a22 22 0 0 1 44 0 V880 Z"/>
    </g>
    <rect x="560" y="740" width="520" height="140" fill="url(#winWarm)" fill-opacity="0.4"/>
  </g>

  <!-- side mid-rise buildings -->
  <rect x="230" y="700" width="210" height="180" fill="#1d3049"/>
  <rect x="238" y="712" width="194" height="160" fill="url(#winWarm)"/>
  <rect x="1160" y="680" width="240" height="200" fill="#1a2d45"/>
  <rect x="1168" y="692" width="224" height="180" fill="url(#winWarm)"/>

  <!-- palm silhouettes -->
  <g fill="#0f1a2b">
    <rect x="186" y="760" width="8" height="120"/>
    <path d="M190 760 q-60 -10 -80 20 q40 -18 80 -14 q-50 10 -60 40 q30 -30 60 -30 q-10 30 0 50 q4 -30 10 -50 q30 0 60 30 q-10 -30 -60 -40 q40 -4 80 14 q-20 -30 -80 -20 z"/>
    <rect x="1446" y="770" width="8" height="110"/>
    <path d="M1450 770 q-60 -10 -80 20 q40 -18 80 -14 q-50 10 -60 40 q30 -30 60 -30 q-10 30 0 50 q4 -30 10 -50 q30 0 60 30 q-10 -30 -60 -40 q40 -4 80 14 q-20 -30 -80 -20 z"/>
  </g>

  <!-- ground -->
  <rect y="880" width="1600" height="120" fill="url(#ground)"/>
  <rect y="880" width="1600" height="3" fill="#f59e57" fill-opacity="0.35"/>
  <g fill="#f8fafc" fill-opacity="0.18">
    <rect x="80" y="938" width="120" height="6"/>
    <rect x="320" y="938" width="120" height="6"/>
    <rect x="560" y="938" width="120" height="6"/>
    <rect x="800" y="938" width="120" height="6"/>
    <rect x="1040" y="938" width="120" height="6"/>
    <rect x="1280" y="938" width="120" height="6"/>
  </g>
</svg>
