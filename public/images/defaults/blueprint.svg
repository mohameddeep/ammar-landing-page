<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Architectural blueprint">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3a68"/>
      <stop offset="1" stop-color="#0a2547"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#7cc4ff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 H0 V100" fill="none" stroke="#7cc4ff" stroke-opacity="0.22" stroke-width="1.2"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#cfe9ff" stroke-opacity="0.5" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#gridMajor)"/>

  <!-- floor plan -->
  <g fill="none" stroke="#e6f4ff" stroke-width="6" stroke-linejoin="round">
    <path d="M200 160 H760 V600 H200 Z"/>
    <path d="M200 380 H420"/>
    <path d="M480 380 H760"/>
    <path d="M420 160 V300"/>
    <path d="M420 340 V600"/>
    <path d="M600 380 V600"/>
  </g>
  <!-- walls hatching -->
  <rect x="197" y="157" width="566" height="10" fill="url(#hatch)"/>
  <rect x="197" y="593" width="566" height="10" fill="url(#hatch)"/>
  <!-- doors -->
  <g fill="none" stroke="#cfe9ff" stroke-width="2">
    <path d="M420 300 A40 40 0 0 1 460 340"/>
    <line x1="420" y1="300" x2="460" y2="300"/>
    <path d="M480 380 A60 60 0 0 0 420 440"/>
    <path d="M600 520 A40 40 0 0 1 640 560"/>
  </g>
  <!-- windows -->
  <g stroke="#7cc4ff" stroke-width="4">
    <line x1="270" y1="160" x2="350" y2="160"/>
    <line x1="560" y1="160" x2="680" y2="160"/>
    <line x1="760" y1="220" x2="760" y2="320"/>
    <line x1="270" y1="600" x2="350" y2="600"/>
  </g>
  <!-- furniture hints -->
  <g fill="none" stroke="#cfe9ff" stroke-opacity="0.7" stroke-width="2">
    <rect x="240" y="200" width="120" height="80" rx="6"/>
    <rect x="520" y="200" width="200" height="120" rx="4"/>
    <circle cx="300" cy="490" r="45"/>
    <rect x="640" y="420" width="90" height="140" rx="4"/>
    <rect x="450" y="420" width="120" height="60" rx="4"/>
  </g>
  <!-- dimension lines -->
  <g stroke="#ffb067" stroke-width="2" fill="#ffb067" font-family="Arial, sans-serif" font-size="18">
    <line x1="200" y1="110" x2="760" y2="110"/>
    <line x1="200" y1="100" x2="200" y2="120"/>
    <line x1="760" y1="100" x2="760" y2="120"/>
    <text x="455" y="100" stroke="none">18.60 m</text>
    <line x1="820" y1="160" x2="820" y2="600"/>
    <line x1="810" y1="160" x2="830" y2="160"/>
    <line x1="810" y1="600" x2="830" y2="600"/>
    <text x="835" y="385" stroke="none">14.40 m</text>
  </g>

  <!-- elevation sketch -->
  <g fill="none" stroke="#e6f4ff" stroke-width="3">
    <path d="M900 600 V330 H1100 V600"/>
    <path d="M880 330 L1000 250 L1120 330"/>
    <rect x="930" y="370" width="50" height="60"/>
    <rect x="1020" y="370" width="50" height="60"/>
    <rect x="930" y="470" width="50" height="60"/>
    <rect x="1020" y="470" width="50" height="60"/>
    <line x1="860" y1="600" x2="1140" y2="600"/>
  </g>

  <!-- title block -->
  <g>
    <rect x="880" y="660" width="280" height="100" fill="none" stroke="#e6f4ff" stroke-width="2"/>
    <line x1="880" y1="700" x2="1160" y2="700" stroke="#e6f4ff" stroke-width="1.5"/>
    <line x1="1020" y1="700" x2="1020" y2="760" stroke="#e6f4ff" stroke-width="1.5"/>
    <rect x="896" y="674" width="140" height="10" fill="#cfe9ff" fill-opacity="0.6"/>
    <rect x="896" y="720" width="100" height="8" fill="#cfe9ff" fill-opacity="0.4"/>
    <rect x="1036" y="720" width="100" height="8" fill="#cfe9ff" fill-opacity="0.4"/>
    <rect x="896" y="740" width="70" height="8" fill="#ffb067" fill-opacity="0.6"/>
  </g>

  <!-- drafting tools -->
  <g>
    <polygon points="60,760 60,560 260,760" fill="#7cc4ff" fill-opacity="0.12" stroke="#cfe9ff" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="40" y="60" width="18" height="320" rx="4" fill="#f97316" transform="rotate(-20 49 220)"/>
    <polygon points="40,380 58,380 49,410" fill="#fde7d1" transform="rotate(-20 49 220)"/>
  </g>
</svg>
